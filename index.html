<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ChessFlux</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #4CAF50;
            --danger: #F44336;
            --bg-dark: #0d1b2a;
            --bg-panel: #1a1a1a;
            --text-light: #ccc;
        }
        body { background: #000000; margin: 0; font-family: Arial, sans-serif; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        
        /* === ШАПКА === */
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #111; display: flex; align-items: center; padding: 0 20px; z-index: 5000; }
        .logo { font-size: 24px; font-weight: bold; color: #666; text-decoration: none; margin-right: 40px; cursor: pointer; }
        .logo:hover { color: #fff; }
        .user-panel { margin-left: auto; display: flex; gap: 15px; align-items: center; }
        .nickname-display { color: #4CAF50; text-decoration: none; font-weight: bold; font-size: 16px; position: relative; cursor: pointer; }
        .nickname-display::after { content: 'Профиль'; position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .nickname-display:hover::after { opacity: 1; }
        .auth-btn, .logout-btn { background: #444; color: white; border: 1px solid #666; padding: 5px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .auth-btn:hover, .logout-btn:hover { background: #555; }

        /* === ОСНОВНОЙ ЭКРАН === */
        .main-content { flex-grow: 1; display: flex; padding-top: 80px; padding-bottom: 20px; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--bg-dark); border: 1px solid #444; border-radius: 8px; height: 70vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; overflow: hidden; }
        .chat-messages { flex-grow: 1; overflow-y: auto; padding-right: 10px; margin-bottom: 15px; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; background: #162535; max-width: 80%; line-height: 1.4; }
        .message.self { background: #007bff; align-self: flex-end; margin-left: auto; }
        .chat-input-area { display: flex; gap: 10px; border-top: 1px solid #333; padding-top: 15px; }
        .chat-input-area input { flex-grow: 1; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
        .chat-input-area button { padding: 0 20px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }

        /* === ПРОФИЛЬ === */
        .profile-section { width: 100%; max-width: 600px; margin: 0 auto; display: none; }
        .profile-info { border: 1px solid #444; padding: 20px; border-radius: 8px; background: var(--bg-dark); margin-top: 30px; }

        /* === МОДАЛЬНОЕ ОКНО (ЧИСТОЕ) === */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:6000; opacity:0; transition:opacity 0.2s; }
        .modal-overlay.show { opacity:1; display:flex; }
        .modal-box { background:var(--bg-panel); border:1px solid #444; border-radius:12px; width:90%; max-width:400px; padding:30px; position:relative; transform:scale(0.9); transition:transform 0.2s; }
        .modal-overlay.show .modal-box { transform:scale(1); }
        .modal-close { position:absolute; top:15px; right:20px; background:none; border:none; color:#888; font-size:24px; cursor:pointer; }
        .modal-tabs { display:flex; border-bottom:1px solid #333; margin-bottom:20px; }
        .modal-tab { padding:10px 20px; cursor:pointer; background:none; border:none; color:#ccc; font-size:16px; transition:color 0.2s; }
        .modal-tab.active { color:#fff; border-bottom:2px solid var(--primary); font-weight:bold; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; margin-bottom:5px; color:var(--text-light); }
        .form-group input { width:100%; padding:12px; background:#222; border:1px solid #444; color:white; border-radius:6px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo" id="logoLink">♟ ChessFlux</div>
        <div class="user-panel">
            <a href="#" id="authBtn" class="auth-btn">Войти</a>
            <a href="#" id="nicknameLink" class="nickname-display hidden"></a>
            <a href="#" id="logoutBtn" class="logout-btn hidden">Выйти</a>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Написать в общий чат...">
                <button id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <div class="profile-section" id="profileSection">
        <h2>Ваш профиль</h2>
        <div class="profile-info">
            <h3 id="profileNick"></h3>
            <p><strong>Статистика:</strong></p>
            <p>Сыграно партий: 0</p>
            <p>Побед: 0</p>
            <p>Поражений: 0</p>
            <hr>
            <h3>Смена пароля</h3>
            <form id="changePassForm">
                <div class="form-group"><label for="oldPass">Старый пароль:</label><input type="password" id="oldPass" required></div>
                <div class="form-group"><label for="newPass">Новый пароль:</label><input type="password" id="newPass" required></div>
                <button type="submit">Сменить пароль</button>
            </form>
            <hr>
            <h3>О себе</h3>
            <form id="editForm">
                <div class="form-group"><label for="bioText">Текст:</label><textarea id="bioText" rows="4"></textarea></div>
                <button type="submit">Сохранить</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <button class="modal-close" id="closeAuthModalBtn">&times;</button>
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="login">Вход</button>
                <button class="modal-tab" data-tab="register">Регистрация</button>
            </div>
            
            <form id="loginForm">
                <div class="form-group"><label>Имя пользователя:</label><input type="text" id="logNick" required></div>
                <div class="form-group"><label>Пароль:</label><input type="password" id="logPass" required></div>
                <button type="submit">Войти</button>
            </form>

            <form id="registerForm" class="hidden">
                <div class="form-group"><label>Никнейм:</label><input type="text" id="regNick" required></div>
                <div class="form-group"><label>Пароль:</label><input type="password" id="regPass" required></div>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script>
        /* ==================== БАЗА ДАННЫХ В ПАМЯТИ (для скорости) ==================== */
        let db = JSON.parse(localStorage.getItem('chessfluxDB')) || { users: {}, registerDates: {} };
        
        function saveDB() { localStorage.setItem('chessfluxDB', JSON.stringify(db)); }
        
        function encrypt(p) { return btoa(unescape(encodeURIComponent(p))); }

        /* ==================== ЭЛЕМЕНТЫ ==================== */
        const authModal = document.getElementById('authModal');
        const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
        const authBtn = document.getElementById('authBtn');
        const nicknameLink = document.getElementById('nicknameLink');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginTab = document.querySelector('.modal-tab[data-tab="login"]');
        const registerTab = document.querySelector('.modal-tab[data-tab="register"]');
        const profileSection = document.getElementById('profileSection');
        const chatContainer = document.getElementById('chatContainer');

        /* ==================== МОДАЛЬНОЕ ОКНО ==================== */
        authBtn.onclick = () => { authModal.classList.add('show'); };
        closeAuthModalBtn.onclick = () => { authModal.classList.remove('show'); };
        loginTab.onclick = () => { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); };
        registerTab.onclick = () => { registerTab.classList.add('active'); loginTab.classList.remove('active'); registerForm.classList.remove('hidden'); loginForm.classList.add('hidden'); };

        /* ==================== АВТОРИЗАЦИЯ (ГЛАВНОЕ) ==================== */
        // РЕГИСТРАЦИЯ
        registerForm.onsubmit = (e) => {
            e.preventDefault();
            const nick = document.getElementById('regNick').value.toLowerCase();
            const pass = document.getElementById('regPass').value;
            
            if (db.users[nick]) { alert('Ник занят'); return; }
            if (pass.length < 4) { alert('Пароль короткий'); return; }

            db.users[nick] = encrypt(pass);
            db.registerDates[nick] = new Date().toISOString();
            saveDB();

            // Сразу заходим
            localStorage.setItem('chessfluxUser', nick);
            authModal.classList.remove('show');
            updateUI();
        };

        // ВХОД
        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const nick = document.getElementById('logNick').value.toLowerCase();
            const pass = encrypt(document.getElementById('logPass').value);

            if (!db.users[nick]) { alert('Нет такого юзера'); return; }
            if (db.users[nick] !== pass) { alert('Неверный пароль'); return; }

            localStorage.setItem('chessfluxUser', nick);
            authModal.classList.remove('show');
            updateUI();
        };

        /* ==================== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ==================== */
        function updateUI() {
            const user = localStorage.getItem('chessfluxUser');
            
            if (user) {
                // Мы вошли
                authBtn.classList.add('hidden');
                nicknameLink.innerText = user;
                nicknameLink.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                
                // Автоматически открываем профиль
                chatContainer.style.display = 'none';
                profileSection.style.display = 'block';
                document.getElementById('profileNick').innerText = user;
            } else {
                // Мы вышли
                authBtn.classList.remove('hidden'); // <--- КНОПКА "ВОЙТИ" СНОВА ПОЯВЛЯЕТСЯ
                nicknameLink.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                
                // Показываем чат
                chatContainer.style.display = 'flex';
                profileSection.style.display = 'none';
            }
        }

        // Выход
        logoutBtn.onclick = () => {
            localStorage.removeItem('chessfluxUser');
            updateUI();
        };

        // Клик по нику ChessFlux -> Главная (Чат)
        document.getElementById('logoLink').onclick = () => {
            chatContainer.style.display = 'flex';
            profileSection.style.display = 'none';
        };
        nicknameLink.onclick = () => {
            profileSection.style.display = 'block';
            chatContainer.style.display = 'none';
        };

        /* ==================== ЧАТ (Простой) ==================== */
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        let chatHistory = JSON.parse(localStorage.getItem('chessfluxChat')) || [];

        function renderChat() {
            chatMessages.innerHTML = '';
            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.classList.add('message');
                if (msg.nick === localStorage.getItem('chessfluxUser')) div.classList.add('self');
                div.innerHTML = `<b>${msg.nick}</b>: ${msg.text}`;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.onclick = () => {
            const user = localStorage.getItem('chessfluxUser');
            if (!user) return;
            const text = chatInput.value.trim();
            if (text === '') return;
            chatHistory.push({ nick: user, text: text });
            localStorage.setItem('chessfluxChat', JSON.stringify(chatHistory));
            chatInput.value = '';
            renderChat();
        };
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });

        /* ==================== СМЕНА ПАРОЛЯ ==================== */
        document.getElementById('changePassForm').onsubmit = (e) => {
            e.preventDefault();
            const user = localStorage.getItem('chessfluxUser');
            if (!user) return;
            const oldPass = encrypt(document.getElementById('oldPass').value);
            const newPass = encrypt(document.getElementById('newPass').value);
            if (db.users[user] === oldPass) {
                db.users[user] = newPass;
                saveDB();
                alert('Пароль сменен');
            } else {
                alert('Старый пароль неверен');
            }
        };

        /* ==================== СТАРТ ==================== */
        updateUI();
        renderChat();
    </script>

</body>
</html>
